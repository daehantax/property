<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부동산 세금 계산기 — 증여세·양도세·재산세·종부세</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="topnav" data-page="index"></nav>
<script src="nav.js"></script>

<div class="container">
  <p class="page-intro">
    증여세·양도소득세·재산세·종합부동산세를 세목별로 계산합니다. 모든 계산은 이 브라우저 안에서만 이뤄지며
    입력값이 서버로 전송되지 않습니다. 탭을 눌러 세목을 선택하세요. 상단 메뉴에서 <b>양도·상속·증여·취득·보유</b>
    세목별로 판정기와 계산기를 찾을 수 있고, 아래 「세목별 도구 모음」에서도 한눈에 볼 수 있습니다.
  </p>

  <div class="calc-tabs" id="calcTabs"></div>

  <div class="calc-layout">
    <div class="panel" id="formPanel">
      <div id="fields"></div>
      <button class="btn-primary" id="calcBtn">계산하기</button>
    </div>
    <div class="panel" id="resultPanel">
      <div class="result-empty" id="empty">입력값을 넣고 「계산하기」를 누르세요.</div>
      <div id="result" style="display:none"></div>
    </div>
  </div>

  <h2 class="section-title">세목별 도구 모음 <small>양도 · 상속 · 증여 · 취득 · 보유 · 상담 시나리오 · 세법 동향</small></h2>
  <div class="tool-hub"></div>
</div>

<script src="calculators.js"></script>
</body>
</html>
