<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부동산 세금 계산기 — 증여세·양도세·재산세·종부세</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="topnav" data-page="index"></nav>
<script src="nav.js"></script>

<div class="container">
  <div id="groupView" class="group-view" hidden></div>

  <!-- 홈: 주소에 #이 없을 때 — 세목별 전체 도구 모음 -->
  <div id="homeView" hidden>
    <div class="home-hero">
      <h1>부동산 세무 도구</h1>
      <p>양도·상속·증여·취득·보유 세목별 계산기와 판정기입니다. 모든 계산은 이 브라우저 안에서만 이뤄지며 입력값이 서버로 전송되지 않습니다.</p>
    </div>
    <div class="tool-hub"></div>
  </div>

  <!-- 계산기: index.html#transfer 처럼 계산기 해시일 때 -->
  <div id="calcArea" hidden>
  <div class="calc-tabs" id="calcTabs"></div>

  <div class="calc-layout">
    <div class="panel" id="formPanel">
      <div id="fields"></div>
      <button class="btn-primary" id="calcBtn">계산하기</button>
    </div>
    <div class="panel" id="resultPanel">
      <div class="result-empty" id="empty">입력값을 넣고 「계산하기」를 누르세요.</div>
      <div id="result" style="display:none"></div>
    </div>
  </div>
  </div>
</div>

<script src="calculators.js"></script>
</body>
</html>
