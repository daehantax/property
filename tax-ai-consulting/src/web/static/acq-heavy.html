<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>취득세 계산기 — 중과(8%·12%) 판정 포함</title>
<link rel="stylesheet" href="styles.css">
<style>
  .hj-layout { display: flex; gap: 18px; align-items: flex-start; }
  #hjForm { width: 440px; flex-shrink: 0; }
  #hjResult { flex: 1; min-width: 0; min-height: 400px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .card > h4 { margin: 0 0 8px; font-size: 14.5px; color: var(--navy); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
  .grid2 label { margin: 0 0 2px; }
  .row-mini { border: 1px solid var(--line); border-radius: 9px; padding: 10px; margin-bottom: 8px; position: relative; background: #fbfcfd; }
  .row-mini .del { position: absolute; top: 8px; right: 8px; border: none; background: #f5b7b1; color: #7b241c; border-radius: 6px; width: 24px; height: 24px; cursor: pointer; font-weight: 800; }
  .add-btn { width: 100%; padding: 9px; border: 1px dashed #6f8496; background: #fff; border-radius: 8px; color: #47606f; font-weight: 700; cursor: pointer; font-family: inherit; }
  .money-hint { font-size: 13px; color: #2874a6; min-height: 13px; }
  .chk { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 14.5px; color: #34495e; font-weight: 700; }
  .chk input { width: auto; }
  .btn-primary { width: 100%; margin-top: 8px; padding: 13px; border: none; border-radius: 8px; background: var(--navy); color: #fff; font-size: 15px; font-weight: 800; cursor: pointer; font-family: inherit; }
  .btn-primary:hover { background: var(--navy-d); }

  .verdict { border-radius: 12px; padding: 20px; margin-bottom: 14px; }
  .verdict.heavy { background: #fdecea; border: 1px solid #f5b7b1; }
  .verdict.light { background: #eafaf1; border: 1px solid #abebc6; }
  .verdict .tag { display: inline-block; font-size: 13.5px; font-weight: 800; padding: 3px 12px; border-radius: 999px; }
  .verdict.heavy .tag { background: #c0392b; color: #fff; }
  .verdict.light .tag { background: #1e8449; color: #fff; }
  .verdict .head { font-size: 30px; font-weight: 800; margin-top: 8px; color: #1a2733; letter-spacing: -0.5px; }
  .verdict .sub { font-size: 15px; color: #566573; margin-top: 4px; }
  .count-badge { display: inline-flex; align-items: baseline; gap: 6px; background: #eaf2f8; border: 1px solid #aed6f1; border-radius: 10px; padding: 8px 14px; margin-bottom: 12px; }
  .count-badge b { font-size: 24px; color: var(--navy); }

  table.matrix { border-collapse: collapse; width: 100%; margin: 6px 0 12px; font-size: 14px; }
  table.matrix th, table.matrix td { border: 1px solid #cdd7df; padding: 6px 8px; text-align: center; }
  table.matrix th { background: #eaf2f8; color: #1a5276; }
  table.matrix td.on { background: #fdecea; font-weight: 800; color: #c0392b; box-shadow: 0 0 0 2px #c0392b inset; }
  table.matrix td.on-light { background: #eafaf1; font-weight: 800; color: #1e8449; box-shadow: 0 0 0 2px #1e8449 inset; }
  table.matrix caption { font-size: 13px; color: #5f7180; text-align: left; margin-bottom: 4px; }

  .lst { margin: 6px 0 0; padding-left: 18px; }
  .lst li { margin: 3px 0; font-size: 14px; line-height: 1.55; }
  .lst.inc li { color: #1a5276; }
  .lst.exc li { color: #5f7180; }
  .reasons { background: #fff9e6; border: 1px solid #f5d97e; border-radius: 10px; padding: 12px 14px; margin: 12px 0; }
  .reasons li { font-size: 14.5px; margin: 4px 0; line-height: 1.6; }
  .muted { font-size: 13.5px; color: #5f7180; margin-top: 10px; line-height: 1.6; }
  .lawref { margin-top: 12px; font-size: 13px; color: #5f7180; border-top: 1px solid var(--line); padding-top: 8px; }
  table.taxtbl { border-collapse: collapse; width: 100%; margin: 4px 0 12px; font-size: 14.5px; }
  table.taxtbl th, table.taxtbl td { border-bottom: 1px solid #dfe6ec; padding: 8px 10px; text-align: right; }
  table.taxtbl th:first-child, table.taxtbl td:first-child { text-align: left; }
  table.taxtbl thead th { background: #eaf2f8; color: #1a5276; font-size: 13.5px; }
  table.taxtbl tr.sum td { font-weight: 800; font-size: 16px; color: #1a2733; border-top: 2px solid #1a5276; border-bottom: none; }
  .notice { border-radius: 10px; padding: 12px 14px; margin: 12px 0; font-size: 14.5px; line-height: 1.6; }
  .notice.red { background: #fdecea; border: 1px solid #f5b7b1; color: #7b241c; }
  .notice.blue { background: #eaf2f8; border: 1px solid #aed6f1; color: #1a5276; }
  .warns { margin: 10px 0 0; padding-left: 18px; }
  .warns li { font-size: 13.5px; color: #7d6608; margin: 4px 0; line-height: 1.6; }
  .fld-hint { font-size: 12.5px; color: #6f8496; margin-top: 2px; line-height: 1.45; }
  .fld-hint a { color: #2874a6; }
  .grid2 .wide { grid-column: 1 / -1; }
  .result-empty { color: #6f8496; text-align: center; margin-top: 140px; }
  @media (max-width: 900px) { .hj-layout { flex-direction: column; } #hjForm { width: 100%; } }
</style>
</head>
<body>
<nav class="topnav" data-page="acq-heavy"></nav>
<script src="nav.js"></script>

<div class="container">
  <p class="page-intro">
    주택 <b>매매·증여·상속·신축</b> 취득세를 계산합니다. <b>취득 후 세대 주택수</b>와 <b>조정대상지역 여부</b>로
    다주택 중과(8%·12%)를 판정하고, 취득세·지방교육세·농어촌특별세를 합산해 보여 줍니다.
    법인 12%, 조정지역 증여 12%, 일시적 2주택, 저가주택 중과제외, 고급주택 가산도 반영합니다.
    기준: 국세청 「2026 주택과 세금」. 계산은 브라우저 안에서만 이뤄집니다.
  </p>

  <div class="hj-layout">
    <div class="panel" id="hjForm">
      <div class="card">
        <h4>이번에 취득하는 주택</h4>
        <div id="targetFields"></div>
      </div>

      <div class="card" id="othersCard">
        <h4>세대가 보유한 다른 주택 <span style="font-weight:400;color:#5f7180">(배우자·동일세대 합산)</span></h4>
        <div id="others"></div>
        <button class="add-btn" id="addBtn">＋ 주택 추가</button>
      </div>

      <button class="btn-primary" id="judgeBtn">취득세 계산하기</button>
    </div>

    <div class="panel" id="hjResult">
      <div class="result-empty" id="empty">주택을 입력하고 「취득세 계산하기」를 누르세요.</div>
      <div id="result" style="display:none"></div>
    </div>
  </div>
</div>

<script src="acq-heavy.js"></script>
</body>
</html>
