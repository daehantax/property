name: daily-check

# 계산기·체크리스트 매일 자동 점검 (API 키 불필요 — 무료 계층)
#   1) 계산 엔진 회귀 테스트 (vitest 289개)
#   2) 정적 사이트 빌드
#   3) 화면 스모크 테스트 — 13개 페이지 로드·JS 에러 0건, 계산기/판정기 버튼 클릭 → 결과 표시 확인
# 실패하면 잡이 빨간불이 되고, "daily-check" 라벨의 GitHub 이슈가 자동 생성/갱신된다.
# (세법 가정 대조는 별도의 law-watch 워크플로가 월·수·금 실행)

on:
  workflow_dispatch:
  schedule:
    # 매일 06:00 KST (전일 21:00 UTC)
    - cron: "0 21 * * *"

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tax-ai-consulting
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: ① 계산 엔진 회귀 테스트
        run: npm test

      - name: ② 정적 사이트 빌드
        run: node scripts/build-static.js

      - name: Chromium 설치 (스모크 테스트용)
        run: npx playwright@1.61.1 install --with-deps chromium

      - name: ③ 화면 스모크 테스트
        run: node scripts/smoke-test.js

      - name: 실패 시 이슈 자동 생성/갱신
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[daily-check 실패] 계산기 자동 점검에서 문제 발견';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toLocaleDateString('ko-KR', { timeZone: 'Asia/Seoul' });
            const body = [
              `**${today} 일일 점검이 실패했습니다.**`,
              '',
              `실패 로그: ${runUrl}`,
              '',
              '확인 순서:',
              '1. 위 링크에서 어느 단계(엔진 테스트 / 빌드 / 화면 스모크)가 실패했는지 확인',
              '2. 엔진 테스트 실패 → 최근 커밋의 계산 로직 회귀 여부 확인',
              '3. 화면 스모크 실패 → 해당 페이지를 브라우저에서 직접 열어 재현',
              '4. 수정 후 이 워크플로를 수동 실행(workflow_dispatch)해 초록불 확인 뒤 이슈 닫기',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'daily-check',
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                body: `${today} 점검도 실패 — ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['daily-check'],
              });
            }
